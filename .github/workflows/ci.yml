name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel wayland libxkbcommon python git
      - uses: actions/checkout@v4
      - run: make
      - run: make test
      - run: make harness
